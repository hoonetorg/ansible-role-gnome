---
# Merged (recursively) with the inventory variable `gnome` into `gnome_final`.
gnome_defaults:
  # system-wide defaults for all users (dconf system db "local"): dconf path (no leading/trailing slash) →
  # key → GVariant value; strings need inner quotes ("'de'"), lists e.g. "[('xkb', 'us'), ('xkb', 'de')]",
  # booleans and numbers as is; a user's own stored value wins unless the key is locked
  settings: {}
  # keys users can't change (full key path, e.g. /org/gnome/desktop/input-sources/sources); the system value
  # also beats values users stored before
  locks: []
  # default applications in GNOME sessions (GNOME and GNOME Classic, /etc/xdg/gnome-mimeapps.list): MIME type →
  # desktop file id, e.g. application/pdf: org.gnome.Evince.desktop; beats the distribution's list, a user's own
  # choice ("Open With" → set as default, ~/.config/mimeapps.list) wins
  default_apps: {}
  # new default of a GSettings key for all users, whatever its path (needed where the path differs per user,
  # e.g. Ptyxis profiles): schema id → key → GVariant value; a user's own stored value wins
  schema_overrides: {}
  packages: [dconf]
