---
# compiles /etc/dconf/db/local.d/* into /etc/dconf/db/local; an invalid GVariant value fails with rc 1 and
# names file, key and value
- name: gnome dconf update
  ansible.builtin.command: dconf update
  changed_when: true

- name: gnome compile schemas
  ansible.builtin.command: glib-compile-schemas {{ gnome_schema_dir }}
  changed_when: true
